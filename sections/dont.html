  <section id="dont">
    <h2><span class="n">02</span> Do / Don't</h2>
    <p class="sec-desc">놀이 브랜드라도 로고만은 규칙에 예외를 두지 않습니다. 아래는 절대 금지입니다.</p>
    <div class="dd-grid">
      <div class="dd dd-dont">
        <div class="dd-head">✕ 그림자 금지</div>
        <div class="dd-body"><svg class="dd-shadow" viewBox="0 0 2235 395"><use href="#vivoir"/></svg></div>
        <div class="dd-list">드롭섀도·글로우 등 입체 효과를 더하지 않습니다.</div>
      </div>
      <div class="dd dd-dont">
        <div class="dd-head">✕ 왜곡 금지</div>
        <div class="dd-body"><svg class="dd-stretch" viewBox="0 0 2235 395"><use href="#vivoir"/></svg></div>
        <div class="dd-list">가로·세로 비율(5.66:1)을 임의로 늘이거나 줄이지 않습니다.</div>
      </div>
      <div class="dd dd-dont">
        <div class="dd-head">✕ 회전 금지</div>
        <div class="dd-body"><svg class="dd-rotate" viewBox="0 0 2235 395"><use href="#vivoir"/></svg></div>

      </div>

        <div class="dd-head">✕ 외곽선 금지</div>

      </div>
    </div>
  </section>
